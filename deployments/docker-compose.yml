services:
  # ==================== 基础设施 ====================
  mysql:
    image: mysql:8.0
    container_name: tgbot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in a local untracked env file}
      MYSQL_DATABASE: ${DB_NAME:-tg_bot}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - tgbot-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tgbot-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tgbot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== 应用服务 ====================
  api:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.api
    container_name: tgbot-api
    restart: unless-stopped
    environment:
      - APP_ENV=local
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in a local untracked env file}
      - DB_NAME=${DB_NAME:-tg_bot}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:?set a random local JWT_SECRET of at least 32 characters}
      - API_PORT=8080
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tgbot-network

  bot:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.bot
    container_name: tgbot-bot
    restart: unless-stopped
    environment:
      - APP_ENV=local
      - BOT_TOKEN=${BOT_TOKEN:-}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in a local untracked env file}
      - DB_NAME=${DB_NAME:-tg_bot}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TRON_ENABLED=false
    profiles:
      - bot
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tgbot-network

  web:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.web
    container_name: tgbot-web
    restart: unless-stopped
    networks:
      - tgbot-network

  # ==================== 反向代理 ====================
  nginx:
    image: nginx:alpine
    container_name: tgbot-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    networks:
      - tgbot-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  tgbot-network:
    driver: bridge
